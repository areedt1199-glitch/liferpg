<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; font-family: "Leelawadee UI", Tahoma, sans-serif; }
  svg text { font-family: "Leelawadee UI", Tahoma, sans-serif; fill: #1b2b24; }
  .t { font-size: 15px; font-weight: 700; }
  .s { font-size: 12px; }
  .l { font-size: 11.5px; fill: #5b4a1a; }
</style></head>
<body>
<svg width="620" height="470" viewBox="0 0 620 470" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2b24"/></marker></defs>
  <!-- client -->
  <rect x="150" y="10" width="320" height="70" rx="10" fill="#eef4ef" stroke="#1b2b24"/>
  <text class="t" x="310" y="38" text-anchor="middle">ผู้เรียน (PWA / แอป Android)</text>
  <text class="s" x="310" y="60" text-anchor="middle">ส่งเฉพาะ "คำสั่ง" และหลักฐานงาน ไม่ส่ง XP เหรียญ หรือเวลา</text>
  <line x1="310" y1="80" x2="310" y2="122" stroke="#1b2b24" stroke-width="1.6" marker-end="url(#a)"/>
  <text class="l" x="318" y="106">HTTPS + ตรวจ Origin</text>
  <!-- server -->
  <rect x="40" y="124" width="540" height="140" rx="10" fill="#fbf6e9" stroke="#1b2b24"/>
  <text class="t" x="310" y="150" text-anchor="middle">Next.js Server (Route Handlers / Server Actions)</text>
  <rect x="60" y="166" width="235" height="84" rx="8" fill="#fff" stroke="#8a7a3a"/>
  <text class="t" x="177" y="190" text-anchor="middle">ผู้ตรวจงาน AI</text>
  <text class="s" x="177" y="211" text-anchor="middle">prompt + เงื่อนไขสำเร็จของด่าน</text>
  <text class="s" x="177" y="229" text-anchor="middle">คั่นงานด้วยตัวคั่น, JSON schema</text>
  <text class="s" x="177" y="245" text-anchor="middle">โควตา AI ต่อผู้ใช้</text>
  <rect x="325" y="166" width="235" height="84" rx="8" fill="#fff" stroke="#8a7a3a"/>
  <text class="t" x="442" y="190" text-anchor="middle">บริการเกมและบัญชี</text>
  <text class="s" x="442" y="211" text-anchor="middle">ยืนยันตัวตน (Supabase Auth)</text>
  <text class="s" x="442" y="229" text-anchor="middle">เรียก RPC ที่ตรวจสิทธิ์</text>
  <text class="s" x="442" y="245" text-anchor="middle">ตรวจคำตอบบอสฝั่งเซิร์ฟเวอร์</text>
  <!-- gemini -->
  <line x1="120" y1="264" x2="120" y2="316" stroke="#1b2b24" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="30" y="318" width="190" height="66" rx="10" fill="#eef1f8" stroke="#1b2b24"/>
  <text class="t" x="125" y="346" text-anchor="middle">Google Gemini API</text>
  <text class="s" x="125" y="368" text-anchor="middle">คืน verdict / feedback / hint</text>
  <!-- verdict to db -->
  <path d="M245 250 L245 400 L318 400" fill="none" stroke="#1b2b24" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text class="l" x="236" y="418" text-anchor="end">บันทึกผลตรวจด้วย</text>
  <text class="l" x="236" y="434" text-anchor="end">service role เท่านั้น</text>
  <line x1="442" y1="264" x2="442" y2="316" stroke="#1b2b24" stroke-width="1.6" marker-end="url(#a)"/>
  <!-- db -->
  <rect x="320" y="318" width="270" height="140" rx="10" fill="#eef4ef" stroke="#1b2b24"/>
  <text class="t" x="455" y="344" text-anchor="middle">PostgreSQL (Supabase)</text>
  <text class="s" x="455" y="368" text-anchor="middle">Row Level Security ทุกตาราง</text>
  <text class="s" x="455" y="388" text-anchor="middle">ฟังก์ชัน security definer ตรวจลำดับด่าน</text>
  <text class="s" x="455" y="408" text-anchor="middle">reward ledger แบบ unique (รับครั้งเดียว)</text>
  <text class="s" x="455" y="428" text-anchor="middle">เฉลยบอสอยู่ใน schema private</text>
  <text class="s" x="455" y="448" text-anchor="middle">ผลตรวจ AI ต้องผ่านก่อนสู้บอส</text>
</svg>
</body></html>
